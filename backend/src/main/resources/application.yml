server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dogfood-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dogfood}
    username: ${SPRING_DATASOURCE_USERNAME:dogfood}
    password: ${SPRING_DATASOURCE_PASSWORD:dogfood_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:7776000000} # 90 days default for hackathon judging window

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:8080}

logging:
  level:
    com.dogfood: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
