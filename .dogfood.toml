# example.dogfood.toml
# Copy this file to `.dogfood.toml` at the repository root and fill in the test tokens.
# Run the acceptance checker with:  python run.py .dogfood.toml

[portal]
# Where your portal is listening after `docker compose up`.
base_url = "http://localhost:8080"

[tiers]
# The tiers claimed. Honest claims only.
claimed = ["T1", "T2"]
pitch = "Self-hostable hackathon submission and judging platform with rigorous RBAC, judge isolation, and z-score normalization."

[auth]
# Header credentials for each test role.
# Obtain fresh bearer tokens via POST /api/auth/login using seeded test credentials:
#   organizer:   organizer@dogfood.local   / organizer_pass123
#   judge_a:     judge_a@dogfood.local     / judge_a_pass123
#   judge_b:     judge_b@dogfood.local     / judge_b_pass123
#   participant: participant@dogfood.local / participant_pass123
